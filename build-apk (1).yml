# Creer ce fichier dans le depot a .github/workflows/build-apk.yml
# Deposer le ZIP original a la racine du meme depot, sans le decompresser.
name: Compiler Declic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Declic-Android-Studio-v1.6.1-routine.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Extraire le projet
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root = Path('android-source').resolve()
          with zipfile.ZipFile('Declic-Android-Studio-v1.6.1-routine.zip') as archive:
              for entry in archive.infolist():
                  if not (root / entry.filename).resolve().is_relative_to(root):
                      raise ValueError('Chemin interdit dans le ZIP')
              archive.extractall(root)
          project = root / 'Declic-Android-Studio-v1.6.1-routine'
          (project / 'local.properties').unlink(missing_ok=True)
          assert (project / 'app/build.gradle').is_file(), 'Projet Android introuvable'
      - name: Installer le SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Compiler la version de test
        working-directory: android-source/Declic-Android-Studio-v1.6.1-routine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Preparer le telechargement
        run: |
          mkdir -p apk
          cp android-source/Declic-Android-Studio-v1.6.1-routine/app/build/outputs/apk/debug/app-debug.apk apk/Declic-v1.6.1-routine.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Declic-APK
          path: apk/Declic-v1.6.1-routine.apk
          if-no-files-found: error
          retention-days: 30
